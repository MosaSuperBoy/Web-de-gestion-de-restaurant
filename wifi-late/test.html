<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Wifi late</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="app-shell login-shell">
        <section class="panel login-panel" aria-labelledby="page-title">
            <p class="eyebrow">Wifi late</p>
            <h1 id="page-title">Connexion</h1>
            <p class="intro">Saisissez le code qui vous a été attribué pour vous connecter. Sa durée commence à la première connexion réussie.</p>

            <form id="login-form" class="form-stack">
                <label for="ticket-code">Code de connexion</label>
                <input id="ticket-code" name="ticket_code" type="text"
                       placeholder="Ex. WL-A1B2-C3D4-E5F6"
                       autocomplete="one-time-code" required>
                <button class="button button-primary" type="submit">Se connecter</button>
            </form>

            <p id="login-notice" class="notice" role="status" aria-live="polite"></p>
            <p class="maintenance-notice" id="maintenance-notice" hidden>
                Le service est actuellement en maintenance. Réessayez plus tard.
            </p>

            <a class="text-link" href="test2.html">Se connecter comme administrateur</a>
        </section>
    </main>
</body>
</html>
